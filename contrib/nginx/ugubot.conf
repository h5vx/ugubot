# nginx in front of ugubot web-gateway, HTTP only.
#
#   cp contrib/nginx/ugubot.conf /etc/nginx/conf.d/ugubot.conf   # or sites-available + symlink
#   sed -i 's/ugubot.example.com/your.domain/' /etc/nginx/conf.d/ugubot.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d your.domain     # adds TLS and the http→https redirect
#
# The file is included in the http {} context, which is where map belongs.

# WebSocket upgrade for /ws; plain requests keep "close" semantics.
map $http_upgrade $ugubot_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ugubot {
    # web-gateway, see UGUBOT_WEB_BIND in .env (deploy) or ports in docker-compose.yml
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ugubot.example.com;

    access_log /var/log/nginx/ugubot.access.log;
    error_log  /var/log/nginx/ugubot.error.log;

    # Only the login form is posted; messages go over the WebSocket.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;

    # proxy_set_header is not inherited by a location that sets any header
    # itself, so the full set is repeated in both locations.
    #
    # The backend checks that the WebSocket Origin matches Host, and marks the
    # session cookie Secure when X-Forwarded-Proto is https (after certbot).

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://ugubot;
    }

    location = /ws {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ugubot_connection_upgrade;
        proxy_pass http://ugubot;

        # The server pings every 30 s; this only bounds a dead connection.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }
}
